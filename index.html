<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Roleplay Forge — The AI Roleplay Workbench</title>
    <link rel="icon" type="image/svg+xml" href="/forge-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#191816" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("roleplay-forge-theme");
          if (savedTheme === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", savedTheme === "light" ? "#f7f4ee" : "#191816");
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roleplay Forge" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
